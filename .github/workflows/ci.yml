name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The runtime is stdlib-only and pyproject declares >=3.10, so the
        # floor is tested as well as a current release. jsonschema is a dev
        # extra, and the suite must pass with and without it: schema.py falls
        # back to a local validator so the runtime stays dependency-free.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install -e '.[dev]'
      - name: tests
        run: pytest -q
      - name: tests without the optional jsonschema
        run: |
          pip uninstall -y jsonschema
          pytest -q

  stdlib-only-runtime:
    # The README promises a stdlib-only runtime. Prove it: import and run the
    # service with nothing installed but the package itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install without dev extras
        run: pip install -e .
      - name: one-shot self-report needs no third-party package
        run: |
          LISTENER55_REPORT_LOG=/tmp/sr.jsonl listener55 --once-report
          test -s /tmp/sr.jsonl
          python3 -c "
          import json
          r = json.loads(open('/tmp/sr.jsonl').readline())
          assert r['schema_version'] == '1.0', r
          assert r['service'] == 'listener-5.5', r
          print('self-report contract emitted:', r['status'])
          "
